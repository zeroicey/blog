<style>
.search-button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  padding: 8px;
  margin-top: 1px;
  color: inherit;
  opacity: 0.85;
}
.search-button:hover {
  opacity: 1;
}
.search-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.5);
}
.search-modal.open {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12vh 16px 16px;
}
.search-modal-content {
  width: min(640px, 100%);
  max-height: 72vh;
  overflow-y: auto;
  border-radius: 8px;
  background: var(--bg-color, #fff);
  padding: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
.search-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-weight: 600;
}
.search-close {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.4rem;
  line-height: 1;
  color: inherit;
}
#search {
  text-align: left;
}
</style>

<div id="search-modal" class="search-modal" role="dialog" aria-modal="true" aria-label="{{ T "search" }}">
  <div class="search-modal-content">
    <div class="search-modal-header">
      <span>{{ T "search" }}</span>
      <button class="search-close" type="button" aria-label="{{ T "close" }}" onclick="closeSearch()">&times;</button>
    </div>
    <div id="search"></div>
  </div>
</div>

{{ if not hugo.IsServer }}
<script>
(function () {
  var modal = document.getElementById("search-modal");
  var uiReady = false;

  function loadPagefind(cb) {
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "/pagefind/pagefind-ui.css";
    document.head.appendChild(link);
    var js = document.createElement("script");
    js.src = "/pagefind/pagefind-ui.js";
    js.onload = cb;
    js.onerror = function () {
      window.alert("{{ T "search_unavailable" }}");
    };
    document.head.appendChild(js);
  }

  function initUI() {
    if (uiReady || typeof PagefindUI === "undefined") return;
    uiReady = true;
    new PagefindUI({ element: "#search", showSubResults: true, showImages: false });
  }

  window.openSearch = function () {
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    if (typeof PagefindUI === "undefined") {
      loadPagefind(initUI);
    } else {
      initUI();
    }
  };

  window.closeSearch = function () {
    modal.classList.remove("open");
    document.body.style.overflow = "";
  };

  modal.addEventListener("click", function (e) {
    if (e.target === modal) closeSearch();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSearch();
  });
})();
</script>
{{ end }}
